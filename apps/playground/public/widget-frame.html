<!doctype html><html><head><meta charset="utf-8"></head><body><script>
addEventListener("message", function load(e) {
  if (e.source !== parent || !e.data || e.data.type !== "agentic-ui-kit:frame-document" || typeof e.data.html !== "string") return;
  removeEventListener("message", load);
  document.open(); document.write(e.data.html); document.close();
});
parent.postMessage({ type: "agentic-ui-kit:frame-ready" }, "*");
</script></body></html>
